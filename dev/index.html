    <style>
      hey-shorty {

      html.dark {

      html.dark hey-shorty {

        --shorty-text-color: #e1e3e8;

        --shorty-secondary-background-color: #2a2b2f;

        --shorty-selected-background: #2a2b2f;

        --shorty-keys-color: #2a2b2f;

        --shorty-breadcrumb-color: color-mix(in srgb, var(--shorty-secondary-color) 90%, white 10%);

        --shorty-content-shadow: rgb(0 0 0 / 70%) 0px 16px 70px;

        --shorty-placeholder-color: #6b6f76;

    <hey-shorty></hey-shorty>

    <div>
      <table>
        <thead>
          <tr>

          <tr>

          </tr>
        </thead>

      </table>
    </div>

    <script lang="ts" type="module">
      const tbody = document.querySelector('table tbody');

      const bookPreview = (title, author, rating, imageUrl) => {
        return `
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px">
      <div style="position:relative;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden">
        <img src="${imageUrl}"
             style="width:100%;height:100%;object-fit:cover;display:block"
             alt="${title}" />
      </div>
        <div style="display:flex;flex-direction:column;gap:4px; justify-content:center; align-items: center; text-align: center;">
          <div style="font-size:13px;font-weight:500;">${title}</div>
          <div style="font-size:11px;opacity:0.6;">${author}</div>
          ${rating ? `<svg class="star" viewBox="0 0 16 16"><polygon points="8,1 10.2,5.5 15,6.2 11.5,9.6 12.3,14.5 8,12.2 3.7,14.5 4.5,9.6 1,6.2 5.8,5.5" fill="var(--color-border-tertiary)"></polygon></svg>` : ''}
        </div>
      </div>`;
      };

      function generateDeepData(depth) {
        if (depth === 0) {
          return { id: 'leaf', name: 'Leaf Item', icon: 'star' };
        }

        return {
          id: `level-${depth}`,
          name: `Level ${depth}`,
          icon: 'folder',
          children: [
            generateDeepData(depth - 1),
            { id: `sibling-${depth}`, name: `Sibling at ${depth}`, icon: 'note' },
          ],
        };
      }

      const darkTheme = () => document.documentElement.classList.add('dark');
      const lightTheme = () => document.documentElement.classList.remove('dark');

      const deepData = generateDeepData(10);

      const currentlyReadingTest = [
        {
          id: 459452,
          title: 'Oathbringer',
          pages: 1243,
          slug: 'oathbringer',
          image: {
            url: 'https://assets.hardcover.app/external_data/42422093/ea15fb4de9d1cf70cd3606c1710e83fc8075826a.jpeg',
          },
          contributions: [
            {
              author: {
                name: 'Brandon Sanderson',
              },
            },
          ],
          author: 'Brandon Sanderson',
          rating: 5,
        },
        {
          id: 340247,
          title: 'Debt: The First 5,000 Years',
          pages: 534,
          slug: 'debt',
          image: {

          title: 'Clean Code: A Handbook of Agile Software Craftsmanship',

          image: {

          hotkeys: ['cmd', 'h'],
          icon: 'home',
          searchKeywords: ['dashboard', 'start', 'main'],
          children: currentlyReadingTest.map(book => {
            const title = book.title;
            const author = book.author;
            const rating = book.rating ?? null;
            const imageUrl = book?.image?.url;

            return {
              id: title,
              name: title,
              icon: 'auto_stories',
              handler: () => {
                return window.open(`https://hardcover.app/books/${book.slug}`, '_blank');
